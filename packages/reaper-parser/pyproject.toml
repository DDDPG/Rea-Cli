[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "reaper-parser"
version = "0.1.0a1"
description = "Lossless REAPER project documents and shared Python views"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=6", "rppxml"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
reaper_parser = ["data/*.json", "py.typed"]
