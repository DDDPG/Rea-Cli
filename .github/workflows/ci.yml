name: Ecosystem conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/reaper-parser pytest
      - run: python -m pytest tests/conformance -q
      - run: python tools/generate_schema.py --check
  rac:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lua compiler
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y lua5.4
          else
            brew install lua@5.4
          fi
      - run: python -m pip install ./packages/reaper-parser './packages/reacli[audio,dev]'
      - run: python -m pytest -m 'not live'
      - name: Outside-checkout smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -I -m rac doctor --profile offline --json
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build twine
      - run: npm ci --prefix apps/reaperdoc
      - run: npm run check --prefix apps/reaperdoc
      - run: npm run build --prefix apps/reaperdoc
      - run: python tools/build_release.py --output dist/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-candidate
          path: dist/candidate
