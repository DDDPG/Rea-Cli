name: Ecosystem conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/reaper-parser pytest
      - run: python -m pytest tests/conformance -q
      - run: python tools/generate_schema.py --check
  rac:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lua compiler
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y lua5.4
          else
            brew install lua@5.4
          fi
      - run: python -m pip install ./packages/reaper-parser './packages/reacli[audio,dev]'
      - run: python -m pytest -m 'not live'
      - name: Outside-checkout smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -I -m rac doctor --profile offline --json
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install build twine
      - run: npm ci --prefix apps/reaperdoc
      - run: npm run check --prefix apps/reaperdoc
      - run: npm run build --prefix apps/reaperdoc
      # Build/check/upload-artifact only; registry publication is workflow_dispatch-only in publish.yml.
      - run: python tools/build_release.py --output dist/candidate
      - name: Validate candidate wheels in isolated environments
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/parser-only"
          "$RUNNER_TEMP/parser-only/bin/python" -m pip install dist/candidate/reaper-parser/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/parser-only/bin/python" -I -c 'import importlib.util; import reaper_parser; assert all(importlib.util.find_spec(name) is None for name in ("rac", "numpy", "rppxml")); text="<REAPER_PROJECT\r\n>\n"; assert reaper_parser.emit(reaper_parser.parse(text)) == text')
          python -m venv "$RUNNER_TEMP/wheel-only"
          "$RUNNER_TEMP/wheel-only/bin/python" -m pip install dist/candidate/reaper-parser/*.whl dist/candidate/reacli/*.whl pytest numpy soundfile
          "$RUNNER_TEMP/wheel-only/bin/python" -I -m pytest tests/test_distribution.py tests/test_reference_distribution.py tests/conformance/test_document.py tests/test_media.py -q
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-only/bin/python" -I -m rac doctor --profile offline --json)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-candidate
          path: dist/candidate
