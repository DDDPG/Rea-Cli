name: Publish reviewed ecosystem
on:
  workflow_dispatch:
    inputs:
      target:
        description: Destination index
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]
      package:
        description: One package to upload
        type: choice
        required: true
        default: reacli
        options: [reacli, reaper-parser]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build twine pytest ./packages/reaper-parser './packages/reacli[audio]'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python -m pytest -m 'not live'
      - run: npm ci --prefix apps/reaperdoc && npm run check --prefix apps/reaperdoc && npm run build --prefix apps/reaperdoc
      - run: python tools/build_release.py --output dist/candidate
      - name: Check public release prerequisites
        env:
          TARGET: ${{ inputs.target }}
        run: python tools/check_publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/candidate
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/candidate
      - name: Collect selected Python distribution
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          mkdir publish
          cp "dist/candidate/${PACKAGE}"/* publish/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.target == 'testpypi'
        with:
          packages-dir: publish/
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.target == 'pypi'
        with:
          packages-dir: publish/
