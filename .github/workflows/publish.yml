# Deliberately manual-only: ordinary pushes, including public-preparation pushes,
# never upload a package to PyPI or TestPyPI.
name: Publish reviewed ecosystem
on:
  workflow_dispatch:
    inputs:
      target:
        description: Destination index
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]
      package:
        description: One package to upload
        type: choice
        required: true
        default: reacli
        options: [reacli, reaper-parser]
      mode:
        description: Normal publication or first-project index bootstrap
        type: choice
        required: true
        default: normal
        options: [normal, testpypi-bootstrap, pypi-bootstrap]
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.target }}-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install build twine pytest ./packages/reaper-parser './packages/reacli[audio]'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python -m pytest -m 'not live'
      - run: npm ci --prefix apps/reaperdoc && npm run check --prefix apps/reaperdoc && npm run build --prefix apps/reaperdoc
      - run: python tools/build_release.py --output dist/candidate
      - name: Check public release prerequisites
        env:
          TARGET: ${{ inputs.target }}
          PACKAGE: ${{ inputs.package }}
          MODE: ${{ inputs.mode }}
        run: python tools/check_publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/candidate
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dists
          path: dist/candidate
      - name: Collect selected Python distribution
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          mkdir publish
          cp "dist/candidate/${PACKAGE}"/* publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: inputs.target == 'testpypi'
        with:
          packages-dir: publish/
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: inputs.target == 'pypi'
        with:
          packages-dir: publish/
