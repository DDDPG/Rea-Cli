name: Publish
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python -m pip install build twine pytest 'rpp>=0.5'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_dist.py dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -m "not live"
      - name: Require a matching version tag for production
        env:
          PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import rac
          if os.environ["PUBLISH_TARGET"] == "pypi":
              expected = f"v{rac.__version__}"
              if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != expected:
                  raise SystemExit(f"Production publishes require the matching tag {expected}")
          PY
      - name: Verify wheel in clean working directory
        run: |
          cd "$RUNNER_TEMP"
          python -I -m rac doctor --profile offline --json
          python -I -m rac knowledge api GetTrack
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-dists
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
